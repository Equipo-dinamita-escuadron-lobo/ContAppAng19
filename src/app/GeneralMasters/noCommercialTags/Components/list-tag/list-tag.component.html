<!-- Contenedor Principal con la fuente Titillium -->
<div class="flex w-full h-full font-titillium">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="w-full px-4 sm:px-6 lg:px-8">
         <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-4 mb-8">
            <div class="flex-1">
                <h1 class="text-2xl sm:text-3xl font-bold text-[var(--color-primary)] underline decoration-[var(--color-secondary)] mb-2">
                    Etiquetas no comerciales
                </h1>
                <p class="text-sm sm:text-base text-gray-600 max-w-3xl leading-relaxed">
                    Administra y configura todas las etiquetas de salida y entrada por motivo no comercial de los iventarios.
                </p>
            </div>
        </div>


        <!-- Actions Bar -->
        <div class="mb-6">
            <div  class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 p-4">
                <!-- Search Field -->
                 <div class="w-full sm:w-[30rem]">
                    <p-iconfield iconPosition="left">
                        <p-inputicon>
                            <i class="pi pi-search text-gray-500"></i>
                        </p-inputicon>
                        <input 
                         pInputText
                         type="text"
                         (input)="tagTable.filterGlobal($any($event.target).value,'contains')"
                         placeholder="Buscar etiquetas no comercial..."
                         class="w-full py-2 px-3 text-sm rounded-md border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-[var(--color-primary)] transition"
                        />
                    </p-iconfield>
                 </div>

                <!-- Buttons -->
                <div class="flex flex-wrap justify-start sm:justify-end gap-2">
                    <p-button
                        label="Crear Etiqueta"
                        icon="pi pi-plus"
                        (onclick)="createTag()"
                        size="small">
                    </p-button>
                </div>
            </div>
        </div>

        <!-- 3. TABLA DE IMPUESTOS: -->
        <p-table #tagTable [value]="filteredTags" [loading]="loading" [paginator]="true" [rows]="10" 
         [rowsPerPageOptions]="[5, 10, 20]"
         [globalFilterFields]="['id','title','description']"
         styleClass="p-datatable-striped font-family-sans"
         [tableStyle]="{'min-width': '50rem'}" responsiveLayout="scroll">

            <ng-template pTemplate="header">
                <tr>
                    <!-- Cabeceras de tabla con el estilo de la guía -->
                    <th pSortableColumn="id" class="font-semibold text-primary border-b-2 border-primary">
                        id <p-sortIcon field="id"></p-sortIcon>
                    </th>
                    <th pSortableColumn="title" class="font-semibold text-primary border-b-2 border-primary">
                        Titulo <p-sortIcon field="title"></p-sortIcon>
                    </th>
                    <th pSortableColumn="description" class="font-semibold text-primary border-b-2 border-primary text-right">
                        Descripción <p-sortIcon field="description"></p-sortIcon>
                    </th>
                </tr>
            </ng-template >
            
            <ng-template pTemplate="body" let-tag>
                <tr class="text-neutral-20">
                    <td class="py-3">{{ tag.id }}</td>
                    <td class="py-3">{{ tag.title }}</td>
                    <td class="py-3">{{ tag.description }}</td>
                    <td class="py-3 text-center">
                     <!-- 4. BOTONES DE ACCIÓN: -->
                        <div class="flex justify-center gap-2">
                            <p-button icon="pi pi-pencil" pTooltip="Editar Impuesto" tooltipPosition="top"
                            (onClick)="editTag(tag)"
                            styleClass="p-button-rounded p-button-text text-complementary-green"></p-button>
                            <p-button icon="pi pi-trash" pTooltip="Eliminar Impuesto" tooltipPosition="top"
                            (onClick)="deleteTag(tag)"
                            styleClass="p-button-rounded p-button-text text-secondary"></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="6" class="text-center py-6 font-family-sans text-neutral-50">
                        No se encontraron impuestos.
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="loadingbody">
                <tr>
                    <td colspan="6" class="text-center py-6 font-family-sans text-neutral-50">
                      <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
                      <p class="mt-2 text-primary">Cargando impuestos...</p>
                    </td>
                </tr>
            </ng-template>



        </p-table>


    </div>
</div>
