<div class="month-calendar" [ngClass]="getMonthGridClass()">
  <!-- Header del mes -->
  <div class="month-header">
    <h3 class="month-title">{{ month.name }}</h3>
  </div>

  <!-- Días de la semana -->
  <div class="weekdays-header">
    <div 
      *ngFor="let dayName of dayNames; let i = index" 
      class="weekday"
      [ngClass]="{'weekend': i === 0 || i === 6}">
      {{ dayName }}
    </div>
  </div>

  <!-- Grid de días -->
  <div class="days-grid">
    <div 
      *ngFor="let day of month.days; trackBy: trackByDay"
      [ngClass]="getDayClass(day)"
      (click)="onDayClick(day)"
      [class.clickable]="day.isCurrentMonth">
      {{ day.dayOfMonth }}
      <!-- Indicador sutil para el día actual -->
      <div *ngIf="day.isToday" class="today-indicator"></div>
    </div>
  </div>

  <!-- Estado del mes -->
  <div class="month-status">
    <p-button 
      *ngIf="month.status === 'fully_closed'" 
      label="Cerrado"
      icon="pi pi-lock"
      (onClick)="onMonthStatusClick()"
      styleClass="p-button-sm p-button-secondary">
    </p-button>
    <p-button 
      *ngIf="month.status === 'fully_open'" 
      label="Abierto"
      icon="pi pi-lock-open"
      (onClick)="onMonthStatusClick()"
      styleClass="p-button-sm p-button-secondary">
    </p-button>
  </div>
</div>
