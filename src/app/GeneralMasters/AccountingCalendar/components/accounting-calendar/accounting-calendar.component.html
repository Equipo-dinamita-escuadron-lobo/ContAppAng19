<div class="flex w-full h-full font-titillium accounting-calendar">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="m-10 w-full h-full font-medium bg-white rounded-3xl p-10 relative">
    <!-- Header -->
    <div class="grid sm:grid-cols-2 sm:justify-between items-start mb-40">
      <div class="items-center mb-6">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
          Calendario Contable
        </h1>
        <p class="font-family-sans font-normal text-sm mt-2">
          Gestione los periodos contables para el registro de transacciones.
        </p>
      </div>

      <!-- Botón de Control Masivo -->
      <div class="flex justify-start sm:justify-end mt-4 sm:mt-0">
        <p-button 
          [label]="areAllMonthsClosed() ? 'Abrir Todos' : 'Cerrar Todos'"
          [icon]="areAllMonthsClosed() ? 'pi pi-unlock' : 'pi pi-times'"
          (onClick)="onToggleAll()"
          [loading]="loading"
          [styleClass]="areAllMonthsClosed() ? 'p-button-success' : 'p-button-danger'">
        </p-button>
      </div>
    </div>

    <!-- Selector de año -->
    <div class="flex justify-center sm:justify-start sm:ml-8 mt-20 mb-16">
      <div class="w-full sm:w-[30rem]">
        <label for="yearSelector" class="font-semibold text-primary">Seleccionar Año</label>
        <div class="mt-2">
          <p-select 
            id="yearSelector"
            [options]="availableYears" 
            [(ngModel)]="selectedYear" 
            (onChange)="onYearChange()"
            placeholder="Seleccione un año"
            [filter]="true"
            optionLabel="label"
            optionValue="value"
            class="w-48 min-w-48"
            [style]="{'min-width': '12rem'}"
            [filterPlaceholder]="'Buscar año...'">
          </p-select>
        </div>
      </div>
    </div>

    <!-- Grid de Calendarios Mensuales -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-month-calendar
        *ngFor="let month of calendarMonths"
        [month]="month"
        [loading]="loading"
        (dayClick)="onDateClick($event)"
        (monthStatusClick)="onMonthStatusClick($event)">
      </app-month-calendar>
    </div>

    <!-- Loading overlay -->
    <div *ngIf="loading" class="loading-overlay">
      <div class="loading-content">
        <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
        <p class="mt-2 text-primary">Cargando calendario contable...</p>
      </div>
    </div>
  </div>
</div>
