<div class="flex w-full h-full font-titillium">
  <div class="m-4 md:m-10 w-full font-medium bg-white rounded-2xl md:rounded-3xl p-6 md:p-10">
    <p-toast></p-toast>

    <!-- Cabecera -->
    <div class="flex justify-between items-start mb-12">
      <div class="items-center">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
          Crear Clase de Documento
        </h1>
        <p class="font-family-sans font-normal text-sm mt-2">
          Ingrese la información requerida para registrar una nueva clase de documento.
        </p>
      </div>
      <div class="hidden sm:block">
        <p-button icon="pi pi-arrow-left" (click)="goBack()" styleClass="p-button-text p-button-secondary"></p-button>
      </div>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-24 mt-24 font-family-sans">
        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary">Nombre</label>
          <input pInputText [pKeyFilter]="nameKeyFilter" formControlName="name" placeholder="Ej: Ingreso" class="w-full md:w-2/3" />
          <small class="text-red-500" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Nombre requerido (solo letras)</small>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button type="button" label="Cancelar" severity="secondary" (onClick)="goBack()"></p-button>
        <p-button type="submit" label="Crear Clase" [disabled]="form.invalid"></p-button>
      </div>
    </form>
  </div>
</div>
