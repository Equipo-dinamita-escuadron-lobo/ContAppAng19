<div class="flex w-full h-full font-titillium">
  <p-toast></p-toast>
  <div class="m-4 md:m-10 w-full font-medium bg-white rounded-2xl md:rounded-3xl p-6 md:p-10">

    <!-- Cabecera -->
    <div class="flex justify-between items-start mb-12">
      <div class="items-center">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
          Crear Cuenta Bancaria
        </h1>
        <p class="font-family-sans font-normal text-sm mt-2">
          Ingrese la información requerida para registrar una nueva cuenta bancaria.
        </p>
      </div>
      <div class="hidden sm:block">
        <p-button icon="pi pi-arrow-left" (click)="goBack()" styleClass="p-button-text p-button-secondary"></p-button>
      </div>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-24 mt-24 font-family-sans">

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary">Número de Cuenta</label>
          <input pInputText pKeyFilter="num" formControlName="accountNumber" placeholder="Ej: 1234567890" maxlength="20" class="w-full md:w-2/3" />
          <small class="text-red-500" *ngIf="form.get('accountNumber')?.touched && form.get('accountNumber')?.invalid">Número de cuenta requerido (solo números)</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary">Banco</label>
          <p-select [options]="banksOptions" formControlName="bankId" placeholder="Seleccione banco" [filter]="true" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small class="text-red-500" *ngIf="form.get('bankId')?.touched && form.get('bankId')?.invalid">Seleccione un banco</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary">Tipo de Cuenta</label>
          <p-select [options]="accountTypesOptions" formControlName="accountType" placeholder="Seleccione tipo" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small class="text-red-500" *ngIf="form.get('accountType')?.touched && form.get('accountType')?.invalid">Seleccione un tipo de cuenta</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary">Cuenta Contable</label>
          <p-select [options]="auxiliaryAccountsOptions" formControlName="cuentaContable" placeholder="Seleccione cuenta contable" [filter]="true" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small class="text-red-500" *ngIf="form.get('cuentaContable')?.touched && form.get('cuentaContable')?.invalid">Seleccione una cuenta contable</small>
        </div>

      </div>

      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button type="button" label="Cancelar" severity="secondary" (onClick)="goBack()"></p-button>
        <p-button type="submit" label="Guardar" [disabled]="form.invalid"></p-button>
      </div>
    </form>
  </div>
</div>
