<div class="flex w-full h-full font-titillium">
  <p-toast></p-toast>
  <div class="m-4 md:m-10 w-full font-medium bg-white rounded-2xl md:rounded-3xl p-6 md:p-10">

    <!-- Cabecera -->
    <div class="flex justify-between items-start mb-12">
      <div class="items-center">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary inline-block">
          <span class="border-b-4 border-secondary-light inline-block pb-1">Crear</span> Banco
        </h1>
        <p class="font-family-sans font-normal text-sm mt-12">
          Ingrese la información requerida para registrar un nuevo banco.
        </p>
      </div>
      <div class="hidden sm:block">
        <p-button icon="pi pi-arrow-left" (click)="goBack()" styleClass="p-button-text p-button-secondary"></p-button>
      </div>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-24 mt-24 font-family-sans">

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Código</label>
          <input pInputText formControlName="code" placeholder="Ej: 01" maxlength="2" class="w-full md:w-1/3" />
          <small style="color: var(--color-error);" *ngIf="form.get('code')?.touched && form.get('code')?.invalid">
            <span *ngIf="form.get('code')?.errors?.['required']">Código requerido</span>
            <span *ngIf="form.get('code')?.errors?.['maxDigits']">Solo se permiten máximo 2 dígitos</span>
          </small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Nombre</label>
          <input pInputText formControlName="name" placeholder="Ej: Banco de Bogotá" maxlength="100" class="w-full md:w-2/3" />
          <small style="color: var(--color-error);" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Nombre requerido</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Monedas</label>
          <p-multiSelect [options]="currenciesOptions" formControlName="currencies" placeholder="Seleccione monedas" [filter]="true" [showClear]="true" class="w-full md:w-2/3" display="chip"></p-multiSelect>
          <small style="color: var(--color-error);" *ngIf="form.get('currencies')?.touched && form.get('currencies')?.invalid">Seleccione al menos una moneda</small>
        </div>

      </div>

      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button type="button" label="Cancelar" severity="secondary" (onClick)="goBack()"></p-button>
        <p-button type="submit" label="Guardar" [disabled]="form.invalid"></p-button>
      </div>
    </form>
  </div>
</div>
