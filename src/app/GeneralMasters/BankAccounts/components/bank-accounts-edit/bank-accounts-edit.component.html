<div class="flex w-full h-full font-titillium">
  <div class="m-4 md:m-10 w-full font-medium bg-white rounded-2xl md:rounded-3xl p-6 md:p-10">

    <!-- Cabecera -->
    <div class="flex justify-between items-start mb-12">
      <div class="items-center">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary inline-block">
          <span class="border-b-4 border-secondary-light inline-block pb-1">Editar</span> Cuenta Bancaria
        </h1>
        <p class="font-family-sans font-normal text-sm mt-12">
          Modifique la información de la cuenta bancaria.
        </p>
      </div>
      <div class="hidden sm:block">
        <p-button icon="pi pi-arrow-left" (click)="goBack()" styleClass="p-button-text p-button-secondary"></p-button>
      </div>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
      <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-24 mt-24 font-family-sans">

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Número de Cuenta</label>
          <input pInputText pKeyFilter="pint" formControlName="accountNumber" placeholder="Ej: 5306917213883684" maxlength="16" class="w-full md:w-2/3" />
          <small class="error-message" *ngIf="form.get('accountNumber')?.touched && form.get('accountNumber')?.invalid">
            <span *ngIf="form.get('accountNumber')?.errors?.['required']">Número de cuenta requerido</span>
            <span *ngIf="form.get('accountNumber')?.errors?.['pattern']">Debe tener entre 8 y 16 dígitos</span>
          </small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Banco</label>
          <p-select [options]="banksOptions" formControlName="bankId" placeholder="Seleccione banco" [filter]="true" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small style="color: var(--color-error);" *ngIf="form.get('bankId')?.touched && form.get('bankId')?.invalid">Seleccione un banco</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Tipo de Cuenta</label>
          <p-select [options]="accountTypesOptions" formControlName="accountType" placeholder="Seleccione tipo" [filter]="true" [showClear]="true" class="w-full md:w-1/2"></p-select>
          <small style="color: var(--color-error);" *ngIf="form.get('accountType')?.touched && form.get('accountType')?.invalid">Seleccione un tipo de cuenta</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Cuenta Contable</label>
          <p-select [options]="auxiliaryAccountsOptions" formControlName="accountingAccountId" placeholder="Seleccione cuenta contable" [filter]="true" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small class="error-message" *ngIf="form.get('accountingAccountId')?.touched && form.get('accountingAccountId')?.invalid">Seleccione una cuenta contable</small>
        </div>

      </div>

      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button type="button" label="Cancelar" severity="secondary" (onClick)="goBack()"></p-button>
        <p-button type="submit" label="Actualizar" [disabled]="form.invalid || loading || !hasChanges()"></p-button>
      </div>
    </form>
  </div>
</div>
