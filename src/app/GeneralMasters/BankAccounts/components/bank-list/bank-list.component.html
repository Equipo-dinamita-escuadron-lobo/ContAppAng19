<div class="flex w-full h-full font-titillium">
    <div class="m-10 w-full h-full font-medium bg-white rounded-3xl p-10">
        <p-toast></p-toast>
        <p-confirmDialog></p-confirmDialog>

        <!-- Header Section -->
        <div class="grid sm:grid-cols-2 sm:justify-between items-start mb-40">
            <div class="items-center mb-6">
                <h1 class="font-family-titillium font-bold text-3xl/41 text-primary inline-block">
                    <span class="border-b-4 border-secondary-light inline-block pb-1">Bancos</span>
                </h1>
                <p class="font-family-sans font-normal text-sm mt-12">
                    Administración de entidades bancarias y sus configuraciones.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-start sm:justify-end mt-4 sm:mt-0 gap-3">
                <p-button label="Crear" icon="pi pi-plus" (click)="navigateToCreate()"></p-button>
                <p-button icon="pi pi-arrow-left" severity="secondary" (click)="goBack()"></p-button>
            </div>
        </div>

        <!-- Search Field -->
        <div class="flex justify-center sm:justify-start sm:ml-8 mt-20 mb-16">
            <div class="w-full sm:w-[30rem]">
                <p-iconfield iconPosition="left">
                    <p-inputicon>
                        <i class="pi pi-search text-gray-500"></i>
                    </p-inputicon>
                    <input
                        pInputText
                        type="text"
                        [(ngModel)]="searchTerm"
                        (input)="onSearch()"
                        placeholder="Buscar banco (código/nombre)..."
                        class="w-full py-2 px-3 text-sm rounded-md border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-[var(--color-primary)] transition"
                    />
                </p-iconfield>
            </div>
        </div>

        <!-- Banks Table -->
        <p-table
            [value]="banks"
            [paginator]="true"
            [rows]="pageSize"
            [totalRecords]="totalRecords"
            [loading]="loading"
            [rowsPerPageOptions]="[5, 10, 20]"
            responsiveLayout="scroll"
            (onSort)="onSort($event)"
            (onPage)="onPage($event)"
            styleClass="p-datatable-striped font-family-sans"
            [tableStyle]="{'min-width': '50rem'}">
            
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="code" class="font-semibold text-primary border-b-2 border-primary">
                        Código
                        <p-sortIcon field="code"></p-sortIcon>
                    </th>
                    <th pSortableColumn="name" class="font-semibold text-primary border-b-2 border-primary">
                        Nombre
                        <p-sortIcon field="name"></p-sortIcon>
                    </th>
                    <th class="font-semibold text-primary border-b-2 border-primary">
                        Moneda
                    </th>
                    <th class="font-semibold text-primary border-b-2 border-primary text-center">Estado</th>
                    <th class="font-semibold text-primary border-b-2 border-primary text-center">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-bank>
                <tr class="text-neutral-20">
                    <td class="py-3">{{ bank.code }}</td>
                    <td class="py-3">{{ bank.name }}</td>
                    <td class="py-3">{{ getCurrenciesDisplay(bank.currencies) }}</td>
                    <td class="py-3 text-center">
                        <p-tag 
                            [value]="bank.status ? 'Activo' : 'Inactivo'" 
                            [severity]="bank.status ? 'success' : 'danger'">
                        </p-tag>
                    </td>
                    <td class="py-3 text-center">
                        <div class="flex justify-center gap-2 items-center">
                            <p-button 
                                icon="pi pi-pencil" 
                                pTooltip="Editar" 
                                tooltipPosition="top"
                                (click)="navigateToEdit(bank)" 
                                styleClass="p-button-rounded p-button-text text-primary">
                            </p-button>
                            <p-button 
                                icon="pi pi-trash" 
                                pTooltip="Eliminar" 
                                tooltipPosition="top"
                                (click)="confirmDelete(bank)" 
                                styleClass="p-button-rounded p-button-text text-secondary">
                            </p-button>
                            <p-toggleSwitch
                                [ngModel]="bank.status"
                                (onChange)="toggleBankStatus(bank, $event.checked)"
                                [pTooltip]="bank.status ? 'Activo' : 'Inactivo'"
                                tooltipPosition="top"
                                styleClass="p-toggleSwitch-sm"
                                [style]="{'transform': 'scale(0.8)'}">
                            </p-toggleSwitch>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="text-center py-6 font-family-sans text-neutral-50">
                        No se encontraron bancos.
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
