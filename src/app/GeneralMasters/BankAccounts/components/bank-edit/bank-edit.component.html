<div class="flex w-full h-full font-titillium">
  <p-toast></p-toast>
  <div class="m-4 md:m-10 w-full font-medium bg-white rounded-2xl md:rounded-3xl p-6 md:p-10">

    <!-- Cabecera -->
    <div class="flex justify-between items-start mb-12">
      <div class="items-center">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
          Editar Banco
        </h1>
        <p class="font-family-sans font-normal text-sm mt-2">
          Modifique la información del banco.
        </p>
      </div>
      <div class="hidden sm:block">
        <p-button icon="pi pi-arrow-left" (click)="goBack()" styleClass="p-button-text p-button-secondary"></p-button>
      </div>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
      <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-24 mt-24 font-family-sans">

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Código</label>
          <input pInputText formControlName="codigo" placeholder="Ej: 01" maxlength="2" class="w-full md:w-1/3" />
          <small style="color: var(--color-error);" *ngIf="form.get('codigo')?.touched && form.get('codigo')?.invalid">
            <span *ngIf="form.get('codigo')?.errors?.['required']">Código requerido</span>
            <span *ngIf="form.get('codigo')?.errors?.['maxDigits']">Solo se permiten máximo 2 dígitos</span>
          </small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Nombre</label>
          <input pInputText formControlName="nombre" placeholder="Ej: Banco de Bogotá" maxlength="100" class="w-full md:w-2/3" />
          <small style="color: var(--color-error);" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">Nombre requerido</small>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-semibold text-primary label-required">Moneda</label>
          <p-select [options]="currenciesOptions" formControlName="moneda" placeholder="Seleccione moneda" [filter]="true" [showClear]="true" class="w-full md:w-2/3"></p-select>
          <small style="color: var(--color-error);" *ngIf="form.get('moneda')?.touched && form.get('moneda')?.invalid">Seleccione una moneda</small>
        </div>

      </div>

      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button type="button" label="Cancelar" severity="secondary" (onClick)="goBack()"></p-button>
        <p-button type="submit" label="Guardar Cambios" [disabled]="form.invalid || loading || !hasChanges()"></p-button>
      </div>
    </form>
  </div>
</div>
