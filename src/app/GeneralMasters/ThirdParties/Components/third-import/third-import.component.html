<!-- Toast para notificaciones -->
<p-toast></p-toast>
<p-dialog
  header="Plantilla de Importación de Terceros"
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90vw', maxWidth: '950px' }"
  styleClass="font-family-sans"
  (onHide)="onHide()">
  
  <div class="p-6">
    <!-- Mensaje principal -->
    <div class="mb-30">
      <p class="font-family-sans text-base leading-relaxed text-neutral-30">
        Querido usuario, asegúrese de que el archivo que usted desea importar contenga los siguientes campos:
      </p>
    </div>

    <!-- Campos obligatorios y opcionales en dos columnas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <!-- Campos obligatorios -->
      <div class="border border-neutral-80 rounded-lg overflow-hidden">
        <div class="flex items-center gap-8 bg-neutral-95 px-4 py-3 border-b border-neutral-80">
          <i class="pi pi-check-circle text-complementary-green text-xl"></i>
          <span class="font-family-sans font-bold text-lg text-neutral-40">Campos Obligatorios</span>
        </div>
        <div class="p-4 bg-white">
          <ul class="list-none p-0 m-0 max-h-96 overflow-y-auto">
            <li *ngFor="let field of requiredFields" class="flex items-center gap-3 py-2">
              <i class="pi pi-angle-right text-neutral-50 text-sm"></i>
              <span class="font-family-sans text-sm text-neutral-30">{{ field }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Campos opcionales -->
      <div class="border border-neutral-80 rounded-lg overflow-hidden">
        <div class="flex items-center gap-8 bg-neutral-95 px-4 py-3 border-b border-neutral-80">
          <i class="pi pi-info-circle text-tertiary text-xl"></i>
          <span class="font-family-sans font-bold text-lg text-neutral-40">Campos Opcionales</span>
        </div>
        <div class="p-4 bg-white">
          <ul class="list-none p-0 m-0 max-h-96 overflow-y-auto">
            <li *ngFor="let field of optionalFields" class="flex items-center gap-3 py-2">
              <i class="pi pi-angle-right text-neutral-50 text-sm"></i>
              <span class="font-family-sans text-sm text-neutral-30">{{ field }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Botón de descarga centrado -->
    <div class="flex justify-end mt-30">
      <p-button 
        label="Descargar Plantilla"
        [loading]="downloading"
        (click)="downloadExcel()"
        icon="pi pi-download"
        styleClass="p-button-success p-button-lg font-family-sans">
      </p-button>
    </div>
  </div>
</p-dialog>
