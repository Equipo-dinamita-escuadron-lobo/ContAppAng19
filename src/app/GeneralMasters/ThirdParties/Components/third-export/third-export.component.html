<!-- Toast para notificaciones -->
<p-toast></p-toast>

<!-- Modal Dialog de PrimeNG para exportación -->
<p-dialog
  header="Exportar Terceros"
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90vw', maxWidth: '950px' }"
  styleClass="font-family-sans"
  (onHide)="onHide()">
  
  <div class="p-6">
    <!-- Descripción -->
    <div class="mb-30">
      <p class="font-family-sans text-base leading-relaxed text-neutral-30">
        Seleccione los campos opcionales que desea incluir en su exportación y el estado de los terceros.
      </p>
    </div>

    <!-- Campos obligatorios y opcionales en dos columnas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-30">
      <!-- Campos obligatorios -->
      <div class="border border-neutral-80 rounded-lg overflow-hidden bg-neutral-95 flex flex-col">
        <div class="flex items-center gap-8 px-14 py-11 border-b border-neutral-80">
          <i class="pi pi-check-circle text-complementary-green"></i>
          <span class="font-family-titillium font-semibold">Campos Obligatorios</span>
        </div>
        <div class="bg-white flex-1 flex flex-col">
          <div class="px-14 py-11 flex-1 overflow-y-auto">
            <ul class="list-none p-0 m-0">
              <li *ngFor="let field of requiredFields" class="flex items-center gap-3 py-2">
                <i class="pi pi-angle-right text-neutral-50 text-sm"></i>
                <span class="font-family-sans text-sm text-neutral-30">{{ field }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Campos opcionales -->
      <div class="border border-neutral-80 rounded-lg overflow-hidden bg-neutral-95 flex flex-col">
        <div class="flex items-center gap-8 px-14 py-11 border-b border-neutral-80">
          <i class="pi pi-info-circle text-tertiary"></i>
          <span class="font-family-titillium font-semibold">Campos Opcionales</span>
        </div>
        <div class="px-14 py-11 bg-white flex-1">
          <ul class="list-none p-0 m-0">
            <li *ngFor="let field of optionalFields" class="flex items-center gap-3 py-2">
              <p-checkbox 
                [binary]="true" 
                [(ngModel)]="field.selected"
                [inputId]="field.value"
                styleClass="mr-2">
              </p-checkbox>
              <label [for]="field.value" class="font-family-sans text-sm text-neutral-30 cursor-pointer">
                {{ field.label }}
              </label>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Filtro de estado -->
    <div class="mb-6">
      <div class="border border-neutral-80 rounded-lg px-14 py-11 bg-neutral-95">
        <label class="font-family-titillium font-semibold mb-16 block">
          Estado de terceros a exportar:
        </label>
        <div class="flex flex-wrap gap-12 mb-8 mt-12">
          <div *ngFor="let option of statusOptions" class="flex items-center">
            <p-radioButton 
              [inputId]="option.label" 
              [value]="option.value" 
              [(ngModel)]="statusFilter"
              name="statusFilter">
            </p-radioButton>
            <label [for]="option.label" class="font-family-sans text-sm text-neutral-30 ml-4 cursor-pointer">
              {{ option.label }}
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de exportación -->
    <div class="flex justify-end mt-30">
      <p-button 
        label="Exportar"
        [loading]="loading"
        [disabled]="loading"
        (click)="startExport()"
        icon="pi pi-download"
        styleClass="p-button-success p-button-lg font-family-sans">
      </p-button>
    </div>
  </div>
</p-dialog>
