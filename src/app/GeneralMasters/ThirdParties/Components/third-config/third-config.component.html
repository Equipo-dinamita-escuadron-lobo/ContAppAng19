<!-- Toast para notificaciones -->
<p-toast></p-toast>

<!-- ConfirmDialog para confirmaciones -->
<p-confirmDialog></p-confirmDialog>

<p-dialog
  [header]="inputData?.title || 'Configuración de Terceros'"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '90vw', maxWidth: '600px' }"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onHide()">

  <!-- Contenido del modal -->
  <div class="p-fluid">
    
    <!-- Botones de navegación -->
    <div class="flex justify-content-center gap-2 mb-4">
      <p-button 
        label="Tipos Identificaciones" 
        icon="pi pi-id-card"
        [severity]="showIdentifications ? 'primary' : 'secondary'"
        (onClick)="showIdentificationsView()">
      </p-button>
      
      <p-button 
        label="Tipos Tercero" 
        icon="pi pi-users"
        [severity]="!showIdentifications ? 'primary' : 'secondary'"
        (onClick)="showThirdTypesView()">
      </p-button>
    </div>

    <!-- Sección de Tipos de Identificación -->
    <div *ngIf="showIdentifications">
      <p-card header="Tipos de Identificaciones" class="mb-3">
        
        <!-- Lista de tipos de identificación -->
        <div *ngIf="!loadingTypeIds && typesId.length > 0">
          <div *ngFor="let typeId of typesId; let i = index" 
               class="flex align-items-center justify-content-between p-3 border-round mb-2 surface-100">
            <span class="text-lg font-medium">{{ typeId.typeId }}</span>
            <p-button 
              icon="pi pi-trash" 
              severity="danger"
              size="small"
              [text]="true"
              pTooltip="Eliminar"
              (onClick)="deleteItem(typesId, i)">
            </p-button>
          </div>
        </div>

        <!-- Input para nueva identificación -->
        <div *ngIf="showInputTypeId" class="flex align-items-center gap-2 p-3 border-round mb-2 surface-50">
          <input 
            pInputText 
            [(ngModel)]="newIdentificatioName" 
            placeholder="Nueva identificación"
            class="flex-1"
            (keydown.enter)="addTypeId(typesId)"
            (keydown.escape)="cancelAddTypeId()">
          <p-button 
            icon="pi pi-check" 
            severity="success"
            size="small"
            (onClick)="addTypeId(typesId)">
          </p-button>
          <p-button 
            icon="pi pi-times" 
            severity="danger"
            size="small"
            (onClick)="cancelAddTypeId()">
          </p-button>
        </div>

        <!-- Botón agregar nueva identificación -->
        <div *ngIf="!showInputTypeId" class="text-center">
          <p-button 
            label="Agregar Nueva Identificación" 
            icon="pi pi-plus"
            severity="info"
            (onClick)="showInputTypeId = true">
          </p-button>
        </div>

        <!-- Estado de carga -->
        <div *ngIf="loadingTypeIds" class="text-center p-4">
          <i class="pi pi-spinner pi-spin" style="font-size: 2rem"></i>
          <p class="mt-2">Cargando tipos de identificación...</p>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="!loadingTypeIds && typesId.length === 0" class="text-center p-4">
          <i class="pi pi-info-circle text-4xl text-gray-400"></i>
          <p class="text-gray-500 mt-2">No hay tipos de identificación configurados</p>
        </div>

      </p-card>
    </div>

    <!-- Sección de Tipos de Tercero -->
    <div *ngIf="!showIdentifications">
      <p-card header="Tipos de Terceros" class="mb-3">
        
        <!-- Lista de tipos de tercero -->
        <div *ngIf="!loadingThirdTypes && thirdTypes.length > 0">
          <div *ngFor="let thirdType of thirdTypes; let i = index" 
               class="flex align-items-center justify-content-between p-3 border-round mb-2 surface-100">
            <span class="text-lg font-medium">{{ thirdType.thirdTypeName }}</span>
            <p-button 
              icon="pi pi-trash" 
              severity="danger"
              size="small"
              [text]="true"
              pTooltip="Eliminar"
              (onClick)="deleteItemId(thirdTypes, i)">
            </p-button>
          </div>
        </div>

        <!-- Input para nuevo tipo de tercero -->
        <div *ngIf="showInputThirdType" class="flex align-items-center gap-2 p-3 border-round mb-2 surface-50">
          <input 
            pInputText 
            [(ngModel)]="newThirdTypeName" 
            placeholder="Nuevo tipo de tercero"
            class="flex-1"
            (keydown.enter)="addThirdType(thirdTypes)"
            (keydown.escape)="cancelAddThirdType()">
          <p-button 
            icon="pi pi-check" 
            severity="success"
            size="small"
            (onClick)="addThirdType(thirdTypes)">
          </p-button>
          <p-button 
            icon="pi pi-times" 
            severity="danger"
            size="small"
            (onClick)="cancelAddThirdType()">
          </p-button>
        </div>

        <!-- Botón agregar nuevo tipo de tercero -->
        <div *ngIf="!showInputThirdType" class="text-center">
          <p-button 
            label="Agregar Nuevo Tipo de Tercero" 
            icon="pi pi-plus"
            severity="info"
            (onClick)="showInputThirdType = true">
          </p-button>
        </div>

        <!-- Estado de carga -->
        <div *ngIf="loadingThirdTypes" class="text-center p-4">
          <i class="pi pi-spinner pi-spin" style="font-size: 2rem"></i>
          <p class="mt-2">Cargando tipos de tercero...</p>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="!loadingThirdTypes && thirdTypes.length === 0" class="text-center p-4">
          <i class="pi pi-info-circle text-4xl text-gray-400"></i>
          <p class="text-gray-500 mt-2">No hay tipos de tercero configurados</p>
        </div>

      </p-card>
    </div>
  </div>

  <!-- Footer con botón de cerrar -->
  <ng-template pTemplate="footer">
    <div class="flex justify-content-end">
      <p-button 
        label="Cerrar" 
        icon="pi pi-times"
        severity="secondary"
        (onClick)="closePopUp()">
      </p-button>
    </div>
  </ng-template>
</p-dialog>
