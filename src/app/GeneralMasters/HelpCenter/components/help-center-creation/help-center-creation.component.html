<div class="flex w-full h-full font-titillium">
  <p-toast></p-toast>

  <div class="m-10 w-full h-full font-medium bg-white rounded-3xl p-10">

    <!-- Header -->
    <div class="grid sm:grid-cols-2 sm:justify-between items-start mb-40">
      <div class="items-center mb-6">
        <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
          Crear Centro de Ayuda
        </h1>
        <p class="font-family-sans font-normal text-sm mt-2">Complete los campos para crear un nuevo centro de ayuda.</p>
      </div>

      <!-- Botones -->
      <div class="flex justify-start sm:justify-end mt-4 sm:mt-0">
        <div class="flex flex-wrap gap-3">
          <p-button label="Cancelar" icon="pi pi-times" (onClick)="onCancel()" styleClass="p-button-secondary"></p-button>
          <p-button label="Crear" icon="pi pi-check" (onClick)="onSubmit()" [disabled]="!form.valid"></p-button>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Módulo -->
        <div class="flex flex-col">
          <label for="moduleId" class="font-semibold text-primary mb-2">Módulo *</label>
          <p-dropdown
            id="moduleId"
            formControlName="moduleId"
            [options]="modules"
            optionLabel="name"
            optionValue="id"
            placeholder="Seleccione un módulo"
            class="w-full"
            [style]="{'border-radius': '8px'}"
          ></p-dropdown>
        </div>

        <!-- Nombre -->
        <div class="flex flex-col">
          <label for="name" class="font-semibold text-primary mb-2">Nombre *</label>
          <input
            pInputText
            id="name"
            formControlName="name"
            placeholder="Ingrese el nombre del centro de ayuda"
            class="w-full py-2 px-3 text-sm rounded-md border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-[var(--color-primary)] transition"
          />
        </div>
      </div>

      <!-- Descripción -->
      <div class="flex flex-col">
        <label for="description" class="font-semibold text-primary mb-2">Descripción *</label>
        <p-editor
          formControlName="description"
          [style]="{'height': '200px'}"
          placeholder="Ingrese la descripción del centro de ayuda"
        ></p-editor>
      </div>
    </form>

  </div>
</div>
