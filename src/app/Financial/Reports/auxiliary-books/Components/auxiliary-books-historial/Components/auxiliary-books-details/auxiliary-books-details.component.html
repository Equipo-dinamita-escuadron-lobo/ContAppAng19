<!-- Main container -->
<div class="h-full w-full rounded-2xl p-4 md:p-6">
  <!-- Header -->
  <div class="mb-6 flex items-center gap-3">
    <span class="material-symbols-outlined text-primary text-3xl md:text-4xl">
      receipt_long
    </span>
    <h1
      class="text-xl md:text-3xl font-bold text-primary underline decoration-secondary underline-offset-4"
    >
      Detalles del Reporte: {{ bookDetails?.type }}
    </h1>
  </div>

  <!-- Details Card -->
  <p-card header="Información General" styleClass="mb-6">
    <div *ngIf="bookDetails" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <strong>ID de Registro:</strong>
        <p>{{ bookDetails.publicId }}</p>
      </div>
      <div>
        <strong>Fecha de Generación:</strong>
        <p>{{ bookDetails.createdAt | date : "dd/MM/yyyy hh:mm a" }}</p>
      </div>
      <div>
        <strong>Usuario:</strong>
        <p>{{ bookDetails.userId }}</p>
      </div>
      <div>
        <strong>Estado Actual:</strong>
        <p>
          <p-tag
            [value]="getLastLogStatus()"
            [severity]="getStatusSeverity(getLastLogStatus())"
          ></p-tag>
        </p>
      </div>
    </div>
    <div *ngIf="!bookDetails" class="text-center p-4">Cargando detalles...</div>
  </p-card>

  <!-- Logs Timeline -->
  <p-card header="Historial de Actividad">
    <p-timeline
      [value]="logs"
      align="alternate"
      styleClass="customized-timeline"
    >
      <ng-template pTemplate="marker" let-event>
        <span
          class="custom-marker shadow-2"
          [style.backgroundColor]="event.color"
        >
          <i [class]="event.icon"></i>
        </span>
      </ng-template>
      <ng-template pTemplate="content" let-event>
        <p-card
          [header]="event.etypeEvent"
          [subheader]="(event.createdAt | date : 'dd/MM/yyyy hh:mm:ss a') ?? ''"
        >
          <p>{{ event.message }}</p>
        </p-card>
      </ng-template>
    </p-timeline>
  </p-card>
</div>
