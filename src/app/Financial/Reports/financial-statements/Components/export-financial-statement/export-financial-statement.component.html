<div class="p-fluid p-4 md:p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Exportar Estado Financiero</h2>
    <button
      pButton
      type="button"
      icon="pi pi-times"
      (click)="closeModal()"
      class="p-button-text p-button-secondary p-button-rounded"
      aria-label="Cerrar modal"
    ></button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
    <div
      class="lg:col-span-3 w-full h-full rounded-lg border border-gray-200 overflow-auto"
    >
      <app-financial-statement-report-preview
        [reportTitle]="reportTitle"
        [enterpriseData]="enterpriseData"
        [generationDate]="generationDate"
        [criteria]="criteriaForPreview"
        [headerConfig]="headerConfig"
        [previewData]="previewData"
        [totals]="totals"
        [styles]="styles"
        [format]="formatSelected"
      ></app-financial-statement-report-preview>
    </div>

    <div
      class="lg:col-span-2 flex flex-col space-y-6 overflow-y-auto max-h-[70vh] pr-2"
    >
      <div>
        <label for="template-select" class="text-lg font-medium mb-2 block"
          >Plantilla</label
        >
        <p-select
          inputId="template-select"
          [options]="templates"
          [(ngModel)]="selectedTemplate"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          placeholder="Selecciona una plantilla"
          styleClass="w-full"
          [appendTo]="'body'"
        >
          <ng-template pTemplate="selectedItem" let-selectedOption>
            <div *ngIf="selectedOption" class="flex items-center gap-2">
              <span>{{ selectedOption.name }}</span>
            </div>
          </ng-template>
          <ng-template pTemplate="item" let-option>
            <div class="flex items-center gap-2">
              <span>{{ option.name }}</span>
            </div>
          </ng-template>
        </p-select>
        <small class="text-gray-500 mt-2 block">
          Si modificas una opción, la plantilla se marcara como
          <b>Personalizada</b>.
        </small>
      </div>

      <p-fieldset legend="Formato">
        <p-selectButton
          [options]="formatOptions"
          [(ngModel)]="formatSelected"
          optionValue="value"
          [allowEmpty]="false"
        >
          <ng-template let-item pTemplate="item">
            <div class="flex items-center justify-center gap-2 px-2">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </div>
          </ng-template>
        </p-selectButton>
      </p-fieldset>

      <p-fieldset legend="Estilos del Encabezado">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="align-select" class="font-medium mb-2 block"
              >Alineacion</label
            >
            <p-selectButton
              id="align-select"
              [options]="alignOptions"
              [ngModel]="styles.align"
              (ngModelChange)="updateStyles({ align: $event })"
              optionValue="value"
            >
              <ng-template let-item pTemplate="item">
                <i
                  [class]="item.icon"
                  [pTooltip]="item.tooltip"
                  tooltipPosition="top"
                ></i>
              </ng-template>
            </p-selectButton>
          </div>
          <div>
            <label for="header-color-picker" class="font-medium mb-2 block"
              >Color de Cabecera
              <p-colorPicker
                [ngModel]="styles.color"
                (ngModelChange)="updateStyles({ color: $event })"
              ></p-colorPicker>
            </label>
          </div>
        </div>
      </p-fieldset>

      <p-fieldset legend="Estilos del Contenido">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="font-select" class="font-medium mb-2 block"
              >Fuente
              <p-select
                inputId="font-select"
                [options]="fonts"
                [ngModel]="styles.font"
                (ngModelChange)="updateStyles({ font: $event })"
                optionLabel="name"
                optionValue="value"
                placeholder="Selecciona una fuente"
                styleClass="w-full"
                [appendTo]="'body'"
              >
                <ng-template let-font pTemplate="item">
                  <div [style.font-family]="font.value">{{ font.name }}</div>
                </ng-template>
                <ng-template let-font pTemplate="selectedItem">
                  <div *ngIf="font" [style.font-family]="font.value">
                    {{ font.name }}
                  </div>
                </ng-template>
              </p-select>
            </label>
          </div>
          <div>
            <label for="fontsize-select" class="font-medium mb-2 block"
              >Tamaño
              <p-select
                inputId="fontsize-select"
                [options]="fontSizes"
                [ngModel]="styles.fontSize"
                (ngModelChange)="updateStyles({ fontSize: $event })"
                optionLabel="label"
                optionValue="value"
                placeholder="Ej: 12px"
                styleClass="w-full"
                [appendTo]="'body'"
              ></p-select>
            </label>
          </div>
        </div>
      </p-fieldset>

      <p-fieldset legend="Envio Manual por Email">
        <div class="flex flex-col gap-3">
          <label for="email-to" class="font-medium text-sm text-slate-700"
            >Correo destino</label
          >
          <input
            id="email-to"
            pInputText
            type="email"
            [(ngModel)]="toEmail"
            placeholder="ejemplo@gmail.com"
          />
          <small class="text-gray-500">
            Envia el reporte usando el formato seleccionado.
          </small>
          <p-button
            label="Enviar por Email"
            icon="pi pi-envelope"
            styleClass="p-button-outlined"
            (click)="sendReportByEmail()"
            (keydown.enter)="sendReportByEmail()"
            type="button"
          ></p-button>
        </div>
      </p-fieldset>
    </div>
  </div>

  <div class="flex justify-end gap-3 mt-8 border-t border-gray-200 pt-4">
    <p-button
      label="Cancelar"
      styleClass="p-button-outlined p-button-secondary"
      (keydown.enter)="closeModal()"
      (click)="closeModal()"
    ></p-button>
    <p-button
      label="Exportar"
      icon="pi pi-download"
      (click)="exportReport()"
      (keydown.enter)="exportReport()"
      type="button"
    ></p-button>
  </div>
</div>
