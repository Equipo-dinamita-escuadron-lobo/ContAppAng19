<div class="h-full w-full rounded-2xl p-4 md:p-6">
  <div class="mb-6 flex justify-between items-start">
    <div>
      <div class="flex items-center gap-3 mb-3">
        <span class="material-symbols-outlined text-primary text-3xl md:text-4xl">
          {{ financialStatementInfo.icon }}
        </span>
        <h1
          class="text-xl md:text-3xl font-bold text-primary underline decoration-secondary-light underline-offset-4"
        >
          {{ financialStatementInfo.name }}
        </h1>
      </div>
      <p class="text-gray-600 text-sm md:text-base leading-relaxed max-w-4xl">
        {{ financialStatementInfo.description }}
      </p>
    </div>

    <div class="flex items-start" *ngIf="isReportGenerated">
      <p-button
        (click)="showExportDialog()"
        (keydown.enter)="showExportDialog()"
        styleClass="p-button-secondary"
        icon="pi pi-file-export"
        label="Exportar"
      ></p-button>
    </div>
  </div>

  <div class="mt-6 bg-white rounded-lg shadow-sm">
    <p-table
      showGridlines
      [value]="dataTable"
      [resizableColumns]="true"
      [responsiveLayout]="'scroll'"
      styleClass="p-datatable-header min-h-[20rem] fs-report-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="text-center" pResizableColumn *ngFor="let col of tableColumns">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td *ngFor="let col of tableColumns" [class]="col.type === 'number' ? 'p-2' : ''">
            <ng-container *ngIf="col.type === 'number'; else plainValue">
              <div
                class="money-cell"
                [innerHTML]="
                  formatMoneyAligned(
                    getNestedValue(row, col.field),
                    col.natureField ? getNestedValue(row, col.natureField) : undefined
                  )
                "
              ></div>
            </ng-container>
            <ng-template #plainValue>
              {{ getNestedValue(row, col.field) }}
            </ng-template>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr style="height: 200px">
          <td [attr.colspan]="tableColumns.length">
            <div class="flex flex-col items-center justify-center h-full">
              <p class="text-sm text-gray-600 max-w-md text-center">
                NO HAY INFORMACION PARA MOSTRAR
              </p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
