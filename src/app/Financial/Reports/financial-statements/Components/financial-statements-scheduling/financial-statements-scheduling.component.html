<div class="p-fluid p-4 md:p-6 h-full flex flex-col">
  <p-toast></p-toast>

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Programar Envio por Correo</h2>
    <button
      pButton
      type="button"
      icon="pi pi-times"
      (click)="close()"
      class="p-button-text p-button-secondary p-button-rounded"
      aria-label="Cerrar modal"
    ></button>
  </div>

  <form [formGroup]="scheduleForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-1">
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 flex-1">
      <div class="lg:col-span-2 flex flex-col h-full">
        <div
          class="bg-slate-50 rounded-lg border border-slate-200 p-6 h-full flex flex-col gap-6"
        >
          <div
            class="flex items-center gap-3 text-slate-700 mb-2 border-b border-slate-200 pb-4"
          >
            <div
              class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center shadow-sm"
            >
              <i class="pi pi-chart-bar text-primary text-xl"></i>
            </div>
            <div>
              <h3 class="font-bold text-lg">Resumen</h3>
              <p class="text-xs text-slate-500">Reporte seleccionado</p>
            </div>
          </div>

          <div class="space-y-5">
            <div>
              <label
                class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1"
                >Nombre del Reporte</label
              >
              <p class="text-slate-800 font-medium text-lg leading-tight">
                {{ reportInfo?.bookName || "Estado Financiero" }}
              </p>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1"
                  >Estado</label
                >
                <p-tag
                  [value]="reportInfo?.status || 'Desconocido'"
                  [severity]="
                    reportInfo?.status === 'Completado' ? 'success' : 'info'
                  "
                  styleClass="text-sm px-3"
                ></p-tag>
              </div>
              <div>
                <label
                  class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1"
                  >ID Publico</label
                >
                <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded font-mono"
                  >#{{ reportInfo?.publicId || "N/A" }}</span
                >
              </div>
            </div>

            <div>
              <label
                class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1"
                >Generado por</label
              >
              <div class="flex items-center gap-2">
                <i class="pi pi-user text-slate-400"></i>
                <span class="text-slate-700">{{ reportInfo?.user || "Sistema" }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-3 flex flex-col space-y-6">
        <p-fieldset legend="Configuracion de Envio">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="font-medium mb-2 block text-slate-700 text-sm"
                >Correo destinatario</label
              >
              <input
                pInputText
                formControlName="email"
                type="email"
                placeholder="ejemplo@gmail.com"
              />
              <small
                *ngIf="
                  scheduleForm.get('email')?.invalid &&
                  scheduleForm.get('email')?.touched
                "
                class="text-red-500 text-xs mt-1 block"
              >
                Ingrese un correo valido.
              </small>
            </div>

            <div>
              <label class="font-medium mb-2 block text-slate-700 text-sm"
                >Formato</label
              >
              <p-select
                [options]="formatOptions"
                optionLabel="label"
                optionValue="value"
                formControlName="format"
                appendTo="body"
              ></p-select>
            </div>

            <div>
              <label class="font-medium mb-2 block text-slate-700 text-sm"
                >Frecuencia</label
              >
              <p-select
                [options]="frequencyOptions"
                optionLabel="label"
                optionValue="value"
                formControlName="frequency"
                appendTo="body"
              ></p-select>
            </div>

            <div>
              <label class="font-medium mb-2 block text-slate-700 text-sm"
                >Hora de envio (segun fecha)</label
              >
              <p-datepicker
                formControlName="scheduleDate"
                [showTime]="true"
                [showIcon]="true"
                [minDate]="minDate"
                dateFormat="dd/mm/yy"
                hourFormat="24"
                placeholder="Seleccione fecha y hora"
                appendTo="body"
              ></p-datepicker>
            </div>
          </div>
        </p-fieldset>

        <small class="text-gray-500">
          Zona horaria aplicada: America/Bogota. Se permite un solo correo por
          programacion.
        </small>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-8 border-t border-gray-200 pt-4 bg-white">
      <p-button
        label="Cancelar"
        styleClass="p-button-outlined p-button-secondary"
        (click)="close()"
      ></p-button>

      <p-button
        type="submit"
        label="Guardar Programacion"
        icon="pi pi-send"
        [loading]="isSaving"
        [disabled]="scheduleForm.invalid || isSaving"
      ></p-button>
    </div>
  </form>
</div>
