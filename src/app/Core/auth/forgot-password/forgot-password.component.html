<app-auth-layout>
  <div class="forgot-form">
    <p-toast></p-toast>

    <h2 class="forgot-title">Recuperar Contraseña</h2>
    <p class="forgot-description">
      Ingresa tu correo institucional y te enviaremos un enlace para recuperar tu cuenta.
    </p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <label for="email" class="forgotfields">
          Correo Institucional <span class="required">*</span>
        </label>
        <div class="input-container">
          <input
            pInputText
            type="email"
            id="email"
            formControlName="email"
            placeholder="usuario@unicauca.edu.co"
            class="w-full"
          />
          <span class="input-icon pi pi-envelope"></span>
        </div>
        <p-message
          severity="error"
          *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')"
          text="El correo electrónico es requerido."
        ></p-message>
        <p-message
          severity="error"
          *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')"
          text="El formato del correo no es válido."
        ></p-message>
      </div>

      <div class="form-submit">
        <button type="submit" [disabled]="isLoading">
          <span *ngIf="isLoading" class="pi pi-spin pi-spinner" style="margin-right: 8px;"></span>
          {{ isLoading ? 'Enviando...' : 'Enviar Enlace' }}
        </button>
      </div>
    </form>

    <div class="back-to-login">
      <a (click)="goToLogin()" class="login-link" style="cursor: pointer;">Volver al inicio de sesión</a>
    </div>
  </div>
</app-auth-layout>
