<app-auth-layaout>
  <div class="login-form">
    <h2 class="login-title">Inicio de sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <label for="username" class="loginfields">
          Correo institucional <span class="required">*</span>
        </label>
        <div class="input-container">
          <input type="text" id="username" formControlName="username" placeholder="usuario@unicauca.edu.co" />
          <span class="input-icon pi pi-envelope"></span> 
        </div>
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="loginForm.get('username')?.hasError('required')"
            text="El correo es requerido"
          ></p-message>
          <p-message
            severity="error"
            *ngIf="loginForm.get('username')?.hasError('email')"
            text="El correo electrónico no es válido."
          ></p-message>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="loginfields">
          Contraseña <span class="required">*</span>
        </label>
        <div class="input-container">
          <input type="password" id="password" formControlName="password" placeholder="**********" />
           <span class="input-icon pi pi-lock"></span>
        </div>
         <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="loginForm.get('password')?.hasError('required')"
            text="La contraseña es requerida"
          ></p-message>
        </div>
      </div>

      <div class="form-submit">
        <button type="submit" [disabled]="loginForm.invalid">
          Iniciar sesión
        </button>
      </div>
    </form>

    <div class="new-user-text">
      ¿Eres un usuario nuevo? 
      <a routerLink="/register" class="register-link">clic aquí para registrarse !</a>
    </div>
    <div class="forgot-password-text">
      <a routerLink="/forgot-password" class="forgot-password-link">¿olvidaste tu contraseña?</a>
    </div>
  </div>
</app-auth-layaout>
