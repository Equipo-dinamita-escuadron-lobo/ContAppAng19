<app-auth-layout>
  <div class="w-full max-w-lg mx-auto p-4 md:p-8">
    
    <p-toast></p-toast>

    <h2
      class="text-3xl font-bold text-[var(--color-primary)] underline decoration-[var(--color-secondary)] mt-6 mb-8 text-center"
    >
      Registro de Usuario
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-4">
      
      <div class="flex flex-col md:flex-row gap-4 mb-4">
        <div class="w-full md:w-1/2">
          <label for="firstName" class="block mb-2 font-semibold">
            Nombres <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="firstName"
            formControlName="firstName"
            placeholder="Ej: Ana"
            class="w-full"
          />
          <p-message
            severity="error"
            *ngIf="
              registerForm.get('firstName')?.touched &&
              registerForm.get('firstName')?.hasError('required')
            "
            text="El nombre es requerido"
          ></p-message>
        </div>

        <div class="w-full md:w-1/2">
          <label for="lastName" class="block mb-2 font-semibold">
            Apellidos <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="lastName"
            formControlName="lastName"
            placeholder="Ej: Gómez"
            class="w-full"
          />
          <p-message
            severity="error"
            *ngIf="
              registerForm.get('lastName')?.touched &&
              registerForm.get('lastName')?.hasError('required')
            "
            text="El apellido es requerido"
          ></p-message>
        </div>
      </div>

      <div class="mb-4">
        <label for="email" class="block mb-2 font-semibold">
          Correo Institucional <span class="text-red-500">*</span>
        </label>
        <input
          pInputText
          type="email"
          id="email"
          formControlName="email"
          placeholder="usuario@unicauca.edu.co"
          class="w-full"
        />
        <p-message
          severity="error"
          *ngIf="
            registerForm.get('email')?.touched &&
            registerForm.get('email')?.hasError('required')
          "
          text="El correo electrónico es requerido"
        ></p-message>
      </div>

      <div class="mb-4">
        <label for="password" class="block mb-2 font-semibold">
          Contraseña <span class="text-red-500">*</span>
        </label>
        <input
          pInputText
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          class="w-full"
        />
        <p-message
          severity="error"
          *ngIf="
            registerForm.get('password')?.touched &&
            registerForm.get('password')?.hasError('required')
          "
          text="La contraseña es requerida"
        ></p-message>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="block mb-2 font-semibold">
          Confirmar Contraseña <span class="text-red-500">*</span>
        </label>
        <input
          pInputText
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Repite la contraseña"
          class="w-full"
        />
        <p-message
          severity="error"
          *ngIf="
            registerForm.get('confirmPassword')?.touched &&
            registerForm.get('confirmPassword')?.hasError('required')
          "
          text="La confirmación es requerida"
        ></p-message>
        <p-message
          severity="error"
          *ngIf="
            registerForm.get('confirmPassword')?.touched &&
            registerForm.hasError('passwordsNotMatching')
          "
          text="Las contraseñas no coinciden"
        ></p-message>
      </div>

      <div class="flex flex-col gap-4 mt-8">
        <p-button
          type="submit"
          label="Registrarse"
          [disabled]="registerForm.invalid"
        >
        </p-button>
      </div>
    </form>

    <div class="text-center mt-6">
      <p>
        ¿Ya tienes una cuenta?
        <a
          (click)="goToLogin()"
          class="font-semibold text-[var(--color-secondary)] hover:underline cursor-pointer"
          >Volver al inicio de sesión</a
        >
      </p>
    </div>
  </div>
</app-auth-layout>
