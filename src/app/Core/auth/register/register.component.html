<app-auth-layaout>
  <div class="register-form">
    <h2 class="register-title">Registro de Usuario</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <label for="firstName" class="registerfields">Nombres <span class="required">*</span></label>
        <div class="input-container">
          <input type="text" id="firstName" formControlName="firstName" placeholder="Ej: Ana">
          <span class="input-icon pi pi-user"></span>
        </div>
        <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="registerForm.get('firstName')?.hasError('required')"
            text="El nombre es requerido"
          ></p-message>
        </div>
      </div>

      <div class="form-group">
        <label for="lastName" class="registerfields">Apellidos <span class="required">*</span></label>
        <div class="input-container">
          <input type="text" id="lastName" formControlName="lastName" placeholder="Ej: Gómez">
          <span class="input-icon pi pi-user"></span>
        </div>
        <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="registerForm.get('lastName')?.hasError('required')"
            text="El apellido es requerido"
          ></p-message>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="registerfields">Correo Institucional <span class="required">*</span></label>
        <div class="input-container">
          <input type="email" id="email" formControlName="email" placeholder="usuario@unicauca.edu.co">
          <span class="input-icon pi pi-envelope"></span>
        </div>
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="registerForm.get('email')?.hasError('required')"
            text="El correo electrónico es requerido"
          ></p-message>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="registerfields">Contraseña <span class="required">*</span></label>
        <div class="input-container">
          <input type="password" id="password" formControlName="password" placeholder="Mínimo 8 caracteres">
          <span class="input-icon pi pi-lock"></span>
        </div>
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-message">
          <p-message
            severity="error"
            *ngIf="registerForm.get('password')?.hasError('required')"
            text="La contraseña es requerida"
          ></p-message>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="registerfields">Confirmar Contraseña <span class="required">*</span></label>
        <div class="input-container">
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Repite la contraseña">
          <span class="input-icon pi pi-lock"></span>
        </div>
        <div *ngIf="(registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched) || (registerForm.hasError('passwordsNotMatching') && registerForm.get('confirmPassword')?.touched)" class="error-message">
          <p-message
            severity="error"
            *ngIf="registerForm.get('confirmPassword')?.hasError('required')"
            text="La confirmación de contraseña es requerida"
          ></p-message>
        </div>
      </div>

      <div class="form-submit">
        <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>
      </div>
    </form>

    <div class="existing-user-text">
      ¿Ya tienes una cuenta? <a (click)="goToLogin()" class="login-link" style="cursor: pointer;">Volver al inicio de sesión</a>
    </div>

  </div>
</app-auth-layaout>
