<div class="w-full">
  <p-toast></p-toast>

  <h1
    class="text-3xl font-bold text-[var(--color-primary)] underline decoration-[var(--color-secondary)] mt-6 mb-4"
  >
    Crear Usuario
  </h1>
  <p class="mb-6 text-lg text-gray-700">
    Complete la información necesaria para crear un nuevo usuario.
  </p>
</div>

<div class="mt-6">
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4">
    <div class="w-full">
      <div class="flex gap-4 mb-4">
        <!-- Nombre -->
        <div class="w-1/2">
          <label for="firstName" class="block mb-2 font-semibold">
            Nombre <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="firstName"
            formControlName="firstName"
            placeholder="Ej: Ana"
            class="w-full"
          />
          <!-- Requerido -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('firstName')?.touched &&
              userForm.get('firstName')?.hasError('required')
            "
            text="El nombre es requerido"
          ></p-message>
          <!-- Solo letras -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('firstName')?.touched &&
              userForm.get('firstName')?.hasError('pattern')
            "
            text="El nombre solo debe contener letras y espacios."
          ></p-message>
        </div>

        <!-- Apellido -->
        <div class="w-1/2">
          <label for="lastName" class="block mb-2 font-semibold">
            Apellido <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="lastName"
            formControlName="lastName"
            placeholder="Ej: Gómez"
            class="w-full"
          />
          <!-- Requerido -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('lastName')?.touched &&
              userForm.get('lastName')?.hasError('required')
            "
            text="El apellido es requerido"
          ></p-message>
          <!-- Solo letras -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('lastName')?.touched &&
              userForm.get('lastName')?.hasError('pattern')
            "
            text="El apellido solo debe contener letras y espacios."
          ></p-message>
        </div>
      </div>

      <div class="flex gap-4 mb-4">
        <!-- Correo Electrónico -->
        <div class="w-1/2">
          <label for="email" class="block mb-2 font-semibold">
            Correo Electrónico <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            id="email"
            formControlName="email"
            placeholder="usuario@ejemplo.com"
            class="w-full"
          />
          <!-- Requerido -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('email')?.touched &&
              userForm.get('email')?.hasError('required')
            "
            text="El correo electrónico es requerido"
          ></p-message>
          <!-- Email inválido -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('email')?.touched &&
              userForm.get('email')?.hasError('email')
            "
            text="El correo electrónico no es válido."
          ></p-message>
        </div>

        <!-- Contraseña -->
        <div class="w-1/2">
          <label for="password" class="block mb-2 font-semibold">
            Contraseña <span class="text-red-500">*</span>
          </label>
          <input
            pInputText
            type="password"
            id="password"
            formControlName="password"
            placeholder="********"
            class="w-full"
          />
          <!-- Requerido -->
          <p-message
            severity="error"
            *ngIf="
              userForm.get('password')?.touched &&
              userForm.get('password')?.hasError('required')
            "
            text="La contraseña es requerida"
          ></p-message>
        </div>
      </div>

      <!-- Roles -->
      <div class="mb-4">
        <label for="roles" class="block mb-2 font-semibold">
          Roles <span class="text-red-500">*</span>
        </label>
        <p-multiSelect
          id="roles"
          [options]="roleOptions"
          formControlName="roles"
          placeholder="Seleccione uno o más roles"
          class="w-full"
        ></p-multiSelect>
        <!-- Requerido -->
        <p-message
          severity="error"
          *ngIf="
            userForm.get('roles')?.touched &&
            userForm.get('roles')?.hasError('required')
          "
          text="Al menos un rol es requerido"
        ></p-message>
      </div>

      <!-- Botones de acción -->
      <div class="flex justify-center gap-4 mt-12 pt-40">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [disabled]="isLoading"
          (onClick)="goBack()"
        >
        </p-button>
        <p-button
          type="submit"
          label="Crear Usuario"
          [disabled]="userForm.invalid || isLoading"
          [loading]="isLoading"
        >
        </p-button>
      </div>
    </div>
  </form>
</div>
