<div class="m-10 w-full h-full font-medium bg-white rounded-3xl p-10">

  <!-- Titulo y descripción -->
  <div class="grid sm:grid-cols-2 sm:justify-between items-start mb-10 ">
    <div class="items-center mb-6">
      <h1 class="font-family-titillium font-bold text-3xl/41 text-primary border-b-4 border-secondary inline-block pb-1">
        Auditoría de Sesiones
      </h1>
      <p class="font-family-sans font-normal text-sm mt-10">
        Aquí podrás supervisar quién y cuándo ingresó al sistema
      </p>
    </div>
  </div>

  <!-- Contenedor de filtros y botones-->
  <div class="flex flex-col gap-4 mb-6">
    <!-- Contenedor de cajas de filtros -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="flex flex-col">
        <label for="fechaInicio" class="mb-1 text-sm font-medium text-gray-700">Fecha inicial</label>
        <p-datePicker 
          id="fechaInicio"
          [(ngModel)]="filtro.fechaInicio"
          dateFormat="dd/mm/yy"
          showIcon="true">
        </p-datePicker>
      </div>
      <div class="flex flex-col">
        <label for="fechaFin" class="mb-1 text-sm font-medium text-gray-700">Fecha final</label>
        <p-datePicker 
          id="fechaFin"
          [(ngModel)]="filtro.fechaFin"
          dateFormat="dd/mm/yy"
          showIcon="true">
        </p-datePicker>
      </div>
      <div class="flex flex-col mr-5">
        <label for="usuario" class="mb-1 text-sm font-medium text-gray-700">Usuario</label>
        <input
          id="usuario"
          type="text"
          pInputText
          [(ngModel)]="filtro.usuario"
          placeholder="Usuario">
      </div>
      <div class="flex flex-col">
        <label for="rol" class="mb-1 text-sm font-medium text-gray-700">Rol</label>
        <p-dropdown 
          id="rol"
          [options]="roles"
          [(ngModel)]="filtro.rol"
          placeholder="Seleccione un rol">
        </p-dropdown>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-between items-center mt-20 mb-10">
      <!-- Boton de aplicar filtros -->
      <div>
        <p-button 
          label="Aplicar filtros" 
          icon="pi pi-filter" 
          severity="info"
          (onClick)="applyFilters()">
        </p-button>
      </div>

      <!-- Botones de exportar -->
      <div class="flex gap-2">
        <p-button 
          label="Exportar PDF" 
          icon="pi pi-file-pdf">
        </p-button>
        <p-button 
          label="Exportar Excel" 
          icon="pi pi-file-excel">
        </p-button>
      </div>
    </div>
  </div>

  <!-- Tabla de sesiones -->
  <p-table 
    [value]="usuariosFiltrados"
    [paginator]="true" 
    [rows]="10" 
    [rowsPerPageOptions]="[5,10,20]"  
    styleClass="p-datatable-striped font-family-sans" 
    [tableStyle]="{'min-width': '50rem'}" 
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="usuario" class="font-semibold text-primary border-b-2 border-primary">
          Usuario
        </th>
        <th pSortableColumn="rol" class="font-semibold text-primary border-b-2 border-primary">
          Rol 
        </th>
        <th pSortableColumn="entrada" class="font-semibold text-primary border-b-2 border-primary">
          Fecha y hora de entrada 
        </th>
        <th pSortableColumn="salida" class="font-semibold text-primary border-b-2 border-primary">
          Fecha y hora de salida 
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr class="text-neutral-20">
        <td class="py-3">{{ row.usuario }}</td>
        <td class="py-3">{{ row.rol }}</td>
        <td class="py-3">{{ row.entrada }}</td>
        <td class="py-3">{{ row.salida }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-6 font-family-sans text-neutral-50">
          No se encontraron registros de sesiones.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
