<!-- Contenedor Principal con la fuente Titillium -->
<div class="flex w-full h-full font-titillium">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="w-full px-4 sm:px-6 lg:px-8">
    <!-- Header Section -->
    <div
      class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-4 mb-8"
    >
      <div class="flex-1">
        <h1
          class="text-2xl sm:text-3xl font-bold text-[var(--color-primary)] underline decoration-[var(--color-secondary)] mb-2"
        >
          Gestión de Usuarios
        </h1>
        <p class="text-sm sm:text-base text-gray-600 max-w-3xl leading-relaxed">
          Administra y configura todos los usuarios del sistema.
        </p>
      </div>
    </div>

    <!-- Actions Bar -->
    <div class="mb-6">
      <div
        class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 p-4"
      >
        <!-- Search Field -->
        <div class="w-full sm:w-[30rem]">
          <p-iconfield iconPosition="left">
            <p-inputicon>
              <i class="pi pi-search text-gray-500"></i>
            </p-inputicon>
            <input
              pInputText
              type="text"
              (input)="
                usersTable.filterGlobal(
                  $any($event.target).value,
                  'contains'
                )
              "
              placeholder="Buscar usuario..."
              class="w-full py-2 px-3 text-sm rounded-md border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-[var(--color-primary)] transition"
            />
          </p-iconfield>
        </div>

        <!-- Buttons -->
        <div class="flex flex-wrap justify-start sm:justify-end gap-2">
          <p-button
            label="Crear Usuario"
            icon="pi pi-plus"
            (onClick)="goToCreateUser()"
            size="small"
          >
          </p-button>
        </div>
      </div>
    </div>

    <!-- TABLA DE USUARIOS: Corregida la alineación con estilos específicos -->
    <p-table
      #usersTable
      [value]="filteredUsers"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20]"
      [globalFilterFields]="globalFilterFields"
      styleClass="p-datatable-striped font-family-sans custom-table-alignment"
      [tableStyle]="{ 'min-width': '50rem' }"
      responsiveLayout="scroll"
    >
      <ng-template pTemplate="header">
        <tr>
          <!-- Cabeceras de tabla con el estilo de la guía -->
          <th
            pSortableColumn="firstName"
            class="font-semibold text-primary border-b-2 border-primary"
          >
            Nombre <p-sortIcon field="firstName"></p-sortIcon>
          </th>
          <th
            pSortableColumn="lastName"
            class="font-semibold text-primary border-b-2 border-primary"
          >
            Apellido <p-sortIcon field="lastName"></p-sortIcon>
          </th>
          <th
            pSortableColumn="email"
            class="font-semibold text-primary border-b-2 border-primary"
          >
            Correo <p-sortIcon field="email"></p-sortIcon>
          </th>
          <th
            pSortableColumn="username"
            class="font-semibold text-primary border-b-2 border-primary"
          >
            Usuario <p-sortIcon field="username"></p-sortIcon>
          </th>
          <th
            class="font-semibold text-primary border-b-2 border-primary"
          >
            Roles
          </th>
          <!-- CORRECCIÓN: Agregar las mismas clases que los otros headers -->
          <th
            class="font-semibold text-primary border-b-2 border-primary text-center"
            style="width: 150px"
          >
            Acciones
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr class="text-neutral-20">
          <td class="py-3" style="vertical-align: middle">
            {{ user.firstName }}
          </td>
          <td class="py-3" style="vertical-align: middle">
            {{ user.lastName }}
          </td>
          <td class="py-3" style="vertical-align: middle">
            {{ user.email }}
          </td>
          <td class="py-3" style="vertical-align: middle">
            {{ user.username }}
          </td>
          <td class="py-3" style="vertical-align: middle">
            <div class="flex flex-wrap gap-1">
              <span
                *ngFor="let role of user.roles | slice:0:3"
                class="inline-block px-2 py-1 rounded text-xs bg-blue-100 text-blue-800"
              >
                {{ role }}
              </span>
              <span
                *ngIf="user.roles.length > 3"
                class="inline-block px-2 py-1 rounded text-xs bg-gray-100 text-gray-800"
              >
                +{{ user.roles.length - 3 }} más
              </span>
            </div>
          </td>
          <!-- CORRECCIÓN: Usar vertical-align middle con CSS inline -->
          <td class="py-3 text-center" style="vertical-align: middle">
            <!-- Botones de acción -->
            <p-button
              icon="pi pi-pencil"
              pTooltip="Editar Usuario"
              tooltipPosition="top"
              (onClick)="goToEditUser(user.id)"
              styleClass="p-button-rounded p-button-text text-complementary-green mr-2"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              pTooltip="Eliminar Usuario"
              tooltipPosition="top"
              (onClick)="redirectToDelete(user.id)"
              styleClass="p-button-rounded p-button-text text-secondary"
            ></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td
            colspan="6"
            class="text-center py-6 font-family-sans text-neutral-50"
          >
            No se encontraron Usuarios.
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr>
          <td
            colspan="6"
            class="text-center py-6 font-family-sans text-neutral-50"
          >
            <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
            <p class="mt-2 text-primary">Cargando Usuarios...</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
