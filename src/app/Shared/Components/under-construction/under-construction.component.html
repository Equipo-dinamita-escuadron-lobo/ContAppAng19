<div class="uc-wrapper">
  <div class="uc-card">
    <span class="uc-tag">{{ tag }}</span>

    <div class="uc-icon-stack" aria-hidden="true">
      <div class="uc-pulse uc-pulse-1"></div>
      <div class="uc-pulse uc-pulse-2"></div>
      <div class="uc-icon-circle">
        <span class="material-symbols-outlined uc-icon">{{ icon }}</span>
      </div>
    </div>

    <h2 class="uc-title">{{ title }}</h2>

    <p class="uc-purpose">{{ purpose }}</p>

    <div class="uc-progress" aria-hidden="true">
      <div class="uc-progress-bar"></div>
    </div>

    <p class="uc-footnote">
      Estamos trabajando para entregarte esta funcionalidad muy pronto.
    </p>
  </div>
</div>
